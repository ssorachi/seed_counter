# Windows (.exe) と Mac (.app) を自動でビルドする
#  - main に push、または Actions 画面の「Run workflow」で実行 → 各ジョブの Artifacts からダウンロード
#  - v1.0 のようなタグを push すると Releases にも自動で添付
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: SeedCounter-Windows
          - os: macos-15            # Apple Silicon (M1〜)
            name: SeedCounter-Mac-AppleSilicon
          - os: macos-15-intel      # Intel Mac（GitHub の Intel 版 macOS は 2027年秋で終了予定）
            name: SeedCounter-Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --windowed --name SeedCounter \
            --collect-submodules skimage --collect-data skimage \
            --collect-all pillow_heif \
            --hidden-import scipy.ndimage \
            seed_counter_app.py

      - name: Self test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dist/SeedCounter/SeedCounter.exe --selftest || true
          cat selftest.txt || cat ~/seed_counter_log.txt; grep -q "selftest OK" selftest.txt

      - name: Self test (Mac)
        if: runner.os == 'macOS'
        run: dist/SeedCounter.app/Contents/MacOS/SeedCounter --selftest

      - name: Test with sample photos (tests/*.jpg があれば)
        shell: bash
        run: |
          shopt -s nullglob; imgs=(tests/*.jpg tests/*.JPG tests/*.heic tests/*.HEIC)
          if [ ${#imgs[@]} -eq 0 ]; then echo "テスト写真なし（スキップ）"; exit 0; fi
          if [ "$RUNNER_OS" = "Windows" ]; then exe=dist/SeedCounter/SeedCounter.exe; else exe=dist/SeedCounter.app/Contents/MacOS/SeedCounter; fi
          "$exe" --cli test_out test_out/result.xlsx "${imgs[@]}" || true
          cat ~/seed_counter_log.txt 2>/dev/null; ls test_out; test -f test_out/result.xlsx

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SeedCounter -DestinationPath ${{ matrix.name }}.zip

      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/SeedCounter.app ${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.name }}.zip
